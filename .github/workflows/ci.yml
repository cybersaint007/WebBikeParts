name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  python:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bike_parts_watcher
          POSTGRES_USER: bizodus
          POSTGRES_PASSWORD: finco53570789
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg://bizodus:finco53570789@localhost:5432/bike_parts_watcher
      DB_SCHEMA: watcher

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: python3 -m alembic upgrade head

      - name: Run tests
        run: python3 -m pytest -q

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bike_parts_watcher
          POSTGRES_USER: bizodus
          POSTGRES_PASSWORD: finco53570789
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: console

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, pgsql, mbstring, xml, bcmath, intl, zip
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create console schema & run Alembic (watcher schema)
        working-directory: .
        run: |
          pip install -e ".[dev]"
          PGPASSWORD=finco53570789 psql -h localhost -U bizodus -d bike_parts_watcher \
            -c "CREATE SCHEMA IF NOT EXISTS console;"
          python3 -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://bizodus:finco53570789@localhost:5432/bike_parts_watcher
          DB_SCHEMA: watcher

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: console/vendor
          key: composer-${{ hashFiles('console/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:'"$(php -r 'echo base64_encode(random_bytes(32));')"'/' .env
        env: {}

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: bike_parts_watcher
          DB_USERNAME: bizodus
          DB_PASSWORD: finco53570789
          DB_SCHEMA: console
          WATCHER_DB_HOST: localhost
          WATCHER_DB_PORT: 5432
          WATCHER_DB_DATABASE: bike_parts_watcher
          WATCHER_DB_USERNAME: bizodus
          WATCHER_DB_PASSWORD: finco53570789
          WATCHER_DB_SCHEMA: watcher

      - name: Run tests
        run: php artisan test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: bike_parts_watcher
          DB_USERNAME: bizodus
          DB_PASSWORD: finco53570789
          DB_SCHEMA: console
          WATCHER_DB_HOST: localhost
          WATCHER_DB_PORT: 5432
          WATCHER_DB_DATABASE: bike_parts_watcher
          WATCHER_DB_USERNAME: bizodus
          WATCHER_DB_PASSWORD: finco53570789
          WATCHER_DB_SCHEMA: watcher

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create stub env files (build only — no real secrets needed)
        run: |
          cp .env.example .env
          cp console/.env.example console/.env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> console/.env

      - name: Build console image
        run: docker build -f Dockerfile.console -t parts-watcher-console .

      - name: Build crawler image
        run: docker build -f Dockerfile.crawler -t parts-watcher-crawler .
