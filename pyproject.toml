[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motorcycle-parts-watcher"
version = "0.1.0"
description = "Crawler and tracker for Suzuki Katana 1100 and Hayabusa 2003 parts listings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "jinja2>=3.1.4",
  "lxml>=5.2.2",
  "playwright>=1.45.0",
  "psycopg[binary]>=3.2.1",
  "pydantic>=2.8.2",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "sqlalchemy>=2.0.32",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
]

[project.scripts]
parts-watch = "motorcycle_parts_watcher.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["motorcycle_parts_watcher*"]
