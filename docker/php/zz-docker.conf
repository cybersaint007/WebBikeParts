[www]
; Listen on all interfaces so nginx can reach PHP-FPM across the Docker network.
; The default (127.0.0.1:9000) only accepts connections from the same container.
listen = 0.0.0.0:9000

; Pass container environment variables through to PHP workers.
; Without this, env_file vars set by Docker Compose are stripped before PHP sees them.
clear_env = no
