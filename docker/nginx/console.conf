server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Use Docker's embedded resolver so nginx re-resolves 'php' after container restarts.
        resolver 127.0.0.11 valid=5s;
        set $upstream php:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
    }

    # Serve uploaded bike images from the named volume (separate mount to avoid
    # conflicting with the read-only public/ bind-mount)
    location /bike-images/ {
        alias /var/www/bike-images/;
        access_log off;
        expires 7d;
    }

    location ~ /\.ht {
        deny all;
    }
}
